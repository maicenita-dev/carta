<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sarah@mauricio:~$</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#0f0c1d;--panel:#1a1530;--rosa:#ff5c9a;--ambar:#ffcb6b;--menta:#7ee8c7;--texto:#ece6ff;--tenue:#7f78a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;
  color:var(--texto);background:#0b0710;
  overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding:14px
}
.pantalla{display:none;width:100%;max-width:520px;max-height:100%}
.pantalla.activa{display:block}
.ventana{max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.cuerpo{padding:4px 2px 18px;overflow-y:auto}
.p{color:var(--menta)}
.boot div{opacity:0;animation:ver .01s forwards;animation-delay:calc(var(--i)*.6s)}
.warn{color:var(--ambar)}
h2{font-size:19px;line-height:1.3;margin:14px 0 4px;color:var(--rosa)}
.preg{opacity:0;animation:ver .01s forwards;animation-delay:3.6s}
.botones{display:flex;gap:14px;justify-content:flex-start;align-items:center;margin:26px 0 18px;min-height:56px}
button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:4px;padding:13px 26px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
#si{position:relative;z-index:5;background:var(--rosa);color:#1a0613;box-shadow:0 0 28px #ff5c9a88;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
#si.total{position:fixed;inset:0;width:100%;height:100%;border-radius:0;z-index:20;margin:0;font-size:min(24vw,150px);transition:none}
#no{background:#ffffff1c;color:var(--texto);font-weight:400;white-space:nowrap}
#no.suelto{position:fixed;z-index:10;transition:left .22s,top .22s}
.log{min-height:92px;font-size:12px;color:var(--tenue)}
.log .WARN{color:var(--ambar)}.log .ERROR,.log .FATAL{color:var(--rosa)}.log .INFO{color:var(--menta)}
.fila{display:flex;gap:10px;align-items:center;margin:16px 0 12px}
input{font-family:inherit;font-size:16px;background:var(--tinta);color:var(--texto);border:1px solid #ffffff33;border-radius:8px;padding:11px 12px;width:100%;min-width:0}
#entrar{background:var(--menta);color:var(--tinta);padding:11px 16px;font-size:15px}
.l{position:relative;padding-left:2.7em;white-space:pre-wrap;word-break:break-word}
.l::before{counter-increment:n;content:counter(n);position:absolute;left:0;width:1.9em;text-align:right;color:#51496f}
.l.err{text-decoration:underline wavy var(--rosa);text-underline-offset:4px}
#codigo{counter-reset:n;min-height:300px}
.c{color:var(--tenue);font-style:italic}.k{color:var(--rosa)}.s{color:var(--ambar)}.f{color:var(--menta)}
#error{color:var(--rosa);margin-top:12px}
#firma,#up{opacity:0;transition:opacity 1s;margin-top:14px}
#firma.ver,#up.ver{opacity:1}
.cur::after{content:"█";color:var(--menta);animation:parpadeo 1s steps(1) infinite}
.barra-v{height:10px;background:#ffffff1c;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.barra-v i{display:block;height:100%;background:var(--rosa)}
.corazon{position:fixed;bottom:-40px;pointer-events:none;color:var(--rosa);opacity:.85;animation:subir linear forwards}
@keyframes subir{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes ver{to{opacity:1}}
@keyframes parpadeo{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.corazon{display:none}#si{transition:none}}
</style>
</head>
<body>

<section id="pregunta" class="pantalla activa">
  <div class="ventana">
    <div class="cuerpo">
      <div class="boot">
        <div style="--i:0"><span class="p" id="prompt"></span> ./pregunta.sh</div>
        <div style="--i:1">Hola, <span id="saludo"></span></div>
        <div style="--i:2">Cargando cariño... [██████████] 100%</div>
        <div style="--i:3" class="warn">WARN: exceso de ternura detectado</div>
        <div style="--i:4">Tengo una pregunta importante:</div>
      </div>
      <div class="preg">
        <h2>¿Me querés un poquito? [Y/n]</h2>
        <div class="botones">
          <button id="si">Sí</button>
          <button id="no">No</button>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>
</section>

<section id="acceso" class="pantalla">
  <div class="ventana">
    <div class="cuerpo">
      <div><span class="p promptX"></span> ./abrir_carta.sh</div>
      <div><span class="warn">[BLOQUEADO]</span> La carta está protegida.</div>
      <div class="warn" id="pista0"></div>
      <div class="fila">
        <span class="p">password:</span>
        <input id="clave" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" autocomplete="off">
        <button id="entrar">Entrar</button>
      </div>
      <div id="logAcceso" class="log"></div>
    </div>
  </div>
</section>

<section id="cartaPantalla" class="pantalla">
  <div class="ventana">
    <div class="cuerpo">
      <div><span class="p promptX"></span> cat -n carta.js</div>
      <div id="codigo"></div>
      <div id="error"></div>
      <div id="firma"></div>
      <div id="up"></div>
    </div>
  </div>
</section>

<script>
/* ====== EDITÁ SOLO ESTO ====== */
const NOMBRE = "Mauricio";
const YO = "Sarah";
const DESDE = "2026-10-12";   // AAAA-MM-DD. Es también la contraseña. Dejalo "" para sacar contraseña y contadores
const FECHA = DESDE.split('-').reverse().join('/');
const yo = YO.toLowerCase(), nom = NOMBRE.toLowerCase();
const CARTA =
`// carta.js — para ${NOMBRE}, de ${YO}
// versión 1.0 · desde el ${FECHA}

const ${yo} = { feliz: false };
const ${nom} = { sonrie: true };

// Lo que descubrí en este primer mes:
if (${nom}.sonrie) {
  ${yo}.feliz = true
}

// Mi bucle favorito:
for (let dia = 1; dia < Infinity; dia++) {
  quererte();
}

// Gracias por hacerme reír aunque el código no compile.
// Te quiero muchísimo. Quería que lo supieras.`;

/* Cada intento de decir "No" muestra: [texto del No, texto del Sí, línea de log] */
const INTENTOS = [
  ["Error 404: 'No' no existe",   "Sí (default)", "WARN: la opción 'No' no se encuentra"],
  ["Syntax error: falta un ;",    "Sí [ok]",         "ERROR: línea 1, falta un punto y coma"],
  ["undefined",                   "SÍ",           "ERROR: la variable 'no' es undefined"],
  ["Ctrl+Z",                      "SÍ!",          "INFO: deshaciendo tu 'No'..."],
  ["¿Probaste apagar y prender?", "SÍ!!",         "INFO: reiniciando tu corazón..."],
  ["Bucle infinito",              "SÍ SÍ",        "WARN: bucle infinito de 'No' detectado"],
  ["if (no) { ... }",             "if (sí) { ok }",    "INFO: el if(no) nunca se ejecuta"],
  ["Cargando... 99%",             "Sí (100%)",    "WARN: 'No' lleva 99% hace rato"],
  ["En mi compu anda",            "Compila: SÍ",  "INFO: en mi compu el Sí funciona perfecto"],
  ["false",                       "true",         "WARN: 'false' no es una respuesta válida"],
  ["Memoria llena",               "SÍ SÍ SÍ",     "ERROR: el Sí ocupa toda la memoria"],
  ["Pantalla azul",            "SÍ <3",         "FATAL: pantalla azul, no hay vuelta atrás"]
];
/* ============================= */

const $ = id => document.getElementById(id);
const si = $('si'), no = $('no');
const prompt_ = yo + "@" + nom + ":~$";
$('prompt').textContent = prompt_;
document.querySelectorAll('.promptX').forEach(e => e.textContent = prompt_);

$('saludo').textContent = NOMBRE;

/* Log de terminal */
function log(t, id = 'log'){
  const [nivel, ...resto] = t.split(': ');
  const d = document.createElement('div');
  const s = document.createElement('span');
  s.className = nivel; s.textContent = nivel;
  d.append(s, ': ' + resto.join(': '));
  const cont = $(id);
  cont.appendChild(d);
  while (cont.children.length > 5) cont.firstChild.remove();
}

/* El "No" huye y el "Sí" invade la pantalla */
let n = 0, ultimo = 0, jugando = true;
function huir(){
  const ahora = Date.now();
  if (!jugando || ahora - ultimo < 300) return;
  ultimo = ahora;
  if (navigator.vibrate) navigator.vibrate(40);
  if (n >= INTENTOS.length){
    jugando = false;
    no.style.display = 'none';
    si.style.transform = '';
    si.textContent = 'SÍ <3';
    si.classList.add('total');
    return;
  }
  const [txtNo, txtSi, linea] = INTENTOS[n];
  n++;
  no.textContent = txtNo;
  no.style.fontSize = Math.max(16 - n*0.35, 11) + 'px';
  no.classList.add('suelto');
  const m = 10, w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = m + Math.random() * Math.max(0, innerWidth - w - 2*m) + 'px';
  no.style.top  = m + Math.random() * Math.max(0, innerHeight - h - 2*m) + 'px';
  si.textContent = txtSi;
  si.style.transform = 'scale(' + Math.pow(1.27, n).toFixed(2) + ')';
  log(linea);
}
function cerca(x, y){
  const r = no.getBoundingClientRect();
  return Math.hypot(x - (r.left + r.width/2), y - (r.top + r.height/2)) < Math.max(r.width, r.height)/2 + 60;
}
no.addEventListener('pointerenter', huir);
no.addEventListener('click', huir);
document.addEventListener('pointermove', e => { if (jugando && cerca(e.clientX, e.clientY)) huir(); });
document.addEventListener('pointerdown', e => { if (jugando && cerca(e.clientX, e.clientY)) huir(); });

/* Corazones flotando */
function corazon(){
  const c = document.createElement('span');
  c.className = 'corazon';
  c.textContent = ['<3','<3','{ }',';','01','//'][Math.random()*6|0];
  c.style.left = Math.random()*100 + 'vw';
  c.style.fontSize = 14 + Math.random()*22 + 'px';
  c.style.animationDuration = 5 + Math.random()*5 + 's';
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 10500);
}
setInterval(corazon, 800);

/* Contraseña: la fecha en que empezaron */
const [anio, mes, dia] = DESDE ? DESDE.split('-') : ['', '', ''];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PISTAS = [
  'Pista 1: es el día en que empezó todo.',
  'Pista 2: fue en ' + MESES[(+mes || 1) - 1] + '.',
  'Pista 3: fue un día ' + (+dia) + '. Ya casi.'
];
$('pista0').textContent = 'Pista: la fecha en que empezó todo (dd/mm/aaaa)';
let fallos = 0;
function intentar(){
  const solo = $('clave').value.replace(/\D/g, '');
  if (solo === dia + mes + anio || solo === dia + mes + anio.slice(2)){
    log('INFO: Acceso concedido', 'logAcceso');
    $('clave').disabled = true; $('entrar').disabled = true;
    setTimeout(abrirCarta, 900);
    return;
  }
  fallos++;
  log('ERROR: contraseña incorrecta (intento ' + fallos + ')', 'logAcceso');
  if (fallos <= PISTAS.length) log('INFO: ' + PISTAS[fallos - 1], 'logAcceso');
  else { log('INFO: bueno, te la regalo', 'logAcceso'); $('clave').value = FECHA; }
}
$('entrar').addEventListener('click', intentar);
$('clave').addEventListener('keydown', e => { if (e.key === 'Enter') intentar(); });

/* Carta que se escribe sola (tocá para saltar la animación) */
let rapido = false;
const esperar = ms => rapido ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
function colorear(t){
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const i = t.indexOf('//');
  let cod = i < 0 ? t : t.slice(0, i);
  const com = i < 0 ? '' : t.slice(i);
  cod = cod.replace(/("[^"]*")/g, '<span class="s">$1</span>')
           .replace(/\b(const|let|function|return|while|true|false|new|if|for|Infinity)\b/g, '<span class="k">$1</span>')
           .replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="f">$1</span>');
  return cod + (com ? '<span class="c">' + com + '</span>' : '');
}
async function escribir(){
  const cont = $('codigo'), divs = [];
  const lineas = CARTA.split('\n');
  for (const linea of lineas){
    const d = document.createElement('div');
    d.className = 'l';
    cont.appendChild(d);
    divs.push(d);
    for (let i = 1; i <= linea.length; i++){
      d.textContent = linea.slice(0, i);
      await esperar(20);
    }
    d.innerHTML = colorear(linea) || '&nbsp;';
    d.scrollIntoView({block: 'nearest'});
    await esperar(110);
  }
  /* El error del punto y coma que "arruina todo" */
  const e = lineas.findIndex(l => l.includes('.feliz = true'));
  if (e >= 0){
    await esperar(500);
    divs[e].classList.add('err');
    $('error').innerHTML = 'SyntaxError: falta un ; en la línea ' + (e + 1) +
      '<br>Un solo punto y coma arruina todo el programa...<br>pero ningún error arruina lo nuestro.';
    $('error').scrollIntoView({block: 'nearest'});
    await esperar(1500);
  }
  $('firma').innerHTML = '<span class="p">' + prompt_ + '</span> enviar_cariño()<br>-> enviado (0 errores en el corazón)';
  $('firma').classList.add('ver');
  relojes();
  $('up').scrollIntoView({block: 'nearest'});
}

/* uptime juntos + cuenta regresiva al próximo deploy (v2.0 = 1er aniversario) */
function relojes(){
  if (!DESDE) return;
  const ini = new Date(DESDE + 'T00:00:00');
  const fin = new Date(ini); fin.setFullYear(ini.getFullYear() + 1);
  const el = $('up'), p = x => String(x).padStart(2, '0');
  const fmt = s => Math.floor(s/86400) + ' días, ' + p(Math.floor(s%86400/3600)) + ':' + p(Math.floor(s%3600/60)) + ':' + p(s%60);
  const t = () => {
    const ahora = Date.now();
    const s = Math.max(0, Math.floor((ahora - ini) / 1000));
    const f = Math.max(0, Math.floor((fin - ahora) / 1000));
    const pct = Math.min(100, Math.max(0, (ahora - ini) / (fin - ini) * 100)).toFixed(1);
    el.innerHTML =
      '<span class="p">' + prompt_ + '</span> uptime<br>up ' + fmt(s) + '<br><br>' +
      '<span class="p">' + prompt_ + '</span> ./deploy.sh --version 2.0<br>' +
      'Próximo deploy: v2.0 el ' + fin.toLocaleDateString('es-AR') + ' (nuestro primer aniversario)<br>' +
      'Faltan ' + fmt(f) + '<br>' +
      '<div class="barra-v"><i style="width:' + pct + '%"></i></div>' + pct + '% cargando...<br><br><span class="p">' + prompt_ + '</span> <span class="cur"></span>';
  };
  t(); setInterval(t, 1000);
  el.classList.add('ver');
}

/* Pantallas */
function abrirCarta(){
  $('acceso').classList.remove('activa');
  $('pregunta').classList.remove('activa');
  $('cartaPantalla').classList.add('activa');
  for (let i = 0; i < 30; i++) setTimeout(corazon, i * 60);
  escribir();
}
si.addEventListener('click', () => {
  jugando = false;
  no.style.display = 'none';
  $('pregunta').classList.remove('activa');
  if (!DESDE) return abrirCarta();
  $('acceso').classList.add('activa');
  $('clave').focus();
});
$('cartaPantalla').addEventListener('pointerdown', () => { rapido = true; });
</script>
</body>
</html>
