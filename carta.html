<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para vos 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ciruela:#1f0a2e;--vino:#7a1250;--rosa:#ff4d8d;--pale:#ffe3ee;--oro:#ffc46b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Caveat',cursive;
  color:var(--pale);
  background:radial-gradient(circle at 50% 30%,var(--vino),var(--ciruela) 75%);
  overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center
}
.pantalla{display:none;width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding:24px}
.pantalla.activa{display:block}
.sobre{font-size:64px;animation:latido 1.2s ease-in-out infinite}
h1{font-size:44px;font-weight:700;line-height:1.1;margin:8px 0}
.sub{font-size:26px;opacity:.85}
h2{font-size:38px;color:var(--oro);margin-top:20px}
.botones{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:28px;flex-wrap:wrap}
button{font-family:inherit;font-size:24px;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;transition:font-size .2s}
button:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
#si{background:var(--rosa);color:#fff;font-size:24px;box-shadow:0 6px 24px #ff4d8d88}
#no{background:#ffffff22;color:var(--pale);white-space:nowrap}
#no.suelto{position:fixed;z-index:10;transition:left .25s,top .25s}
.carta{
  background:#ffffff14;border:1px solid #ffffff33;border-radius:22px;
  padding:26px 22px;text-align:left;font-size:27px;line-height:1.35;
  white-space:pre-wrap;min-height:240px;animation:aparece .6s ease both
}
#firma{text-align:right;font-size:32px;color:var(--oro);margin-top:14px;opacity:0;transition:opacity 1s}
#firma.ver{opacity:1}
#contador{margin-top:20px;font-size:25px;opacity:.9}
.corazon{position:fixed;bottom:-40px;pointer-events:none;opacity:.85;animation:subir linear forwards}
@keyframes subir{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes aparece{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sobre,.carta{animation:none}.corazon{display:none}}
</style>
</head>
<body>

<section id="pregunta" class="pantalla activa">
  <div class="sobre">💌</div>
  <h1 id="saludo"></h1>
  <p class="sub">Tengo una pregunta importante...</p>
  <h2>¿Me querés un poquito?</h2>
  <div class="botones">
    <button id="si">Sí 💖</button>
    <button id="no">No</button>
  </div>
</section>

<section id="cartaPantalla" class="pantalla">
  <div class="carta" id="texto"></div>
  <div id="firma"></div>
  <div id="contador"></div>
</section>

<script>
/* ====== EDITÁ SOLO ESTO ====== */
const CONFIG = {
  nombre: "NOMBRE",            // nombre de tu pareja
  yo: "TU NOMBRE",             // tu nombre (firma)
  desde: "2025-01-01",         // desde cuándo están juntos (AAAA-MM-DD). Dejalo "" si no querés contador
  carta:
`Hola, NOMBRE:

No sé bien cómo explicar todo lo que siento, así que hice esto.

Gracias por estar, por hacerme reír incluso cuando no tengo ganas, y por ser mi lugar favorito.

Cada día a tu lado se siente un poquito más lindo que el anterior.

Te quiero muchísimo. Quería que lo supieras.`
};
/* ============================= */

const $ = id => document.getElementById(id);
const si = $('si'), no = $('no');
$('saludo').textContent = "Hola, " + CONFIG.nombre;

/* El botón "No" huye y el "Sí" crece */
const frases = ["No","¿Lo pensaste bien?","Mirá que me pongo triste 🥺","Dale, apretá el otro 👀","Ese botón no anda 😌","Última oportunidad...","Bueno, me rindo 😏"];
let n = 0;
function huir(e){
  if (e) e.preventDefault();
  n++;
  if (n >= frases.length){
    no.style.display = 'none';
    si.style.fontSize = '64px';
    return;
  }
  no.textContent = frases[n];
  no.classList.add('suelto');
  const m = 12, w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = m + Math.random() * Math.max(0, innerWidth - w - 2*m) + 'px';
  no.style.top  = m + Math.random() * Math.max(0, innerHeight - h - 2*m) + 'px';
  si.style.fontSize = Math.min(24 + n*7, 64) + 'px';
}
no.addEventListener('pointerenter', huir);
no.addEventListener('click', huir);

/* Corazones flotando */
function corazon(){
  const c = document.createElement('span');
  c.className = 'corazon';
  c.textContent = ['💖','💗','💕','❤️','✨'][Math.random()*5|0];
  c.style.left = Math.random()*100 + 'vw';
  c.style.fontSize = 14 + Math.random()*24 + 'px';
  c.style.animationDuration = 5 + Math.random()*5 + 's';
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 10500);
}
setInterval(corazon, 700);

/* Carta que se escribe sola */
function escribir(i = 0){
  $('texto').textContent = CONFIG.carta.slice(0, i);
  if (i < CONFIG.carta.length) setTimeout(() => escribir(i + 1), 45);
  else $('firma').classList.add('ver');
}

/* Contador en vivo */
function contador(){
  if (!CONFIG.desde) return;
  const t = () => {
    const s = Math.floor((Date.now() - new Date(CONFIG.desde + "T00:00:00")) / 1000);
    if (s < 0) return;
    $('contador').textContent =
      `Juntos hace ${Math.floor(s/86400)} días, ${Math.floor(s%86400/3600)} h, ${Math.floor(s%3600/60)} min y ${s%60} s 💕`;
  };
  t(); setInterval(t, 1000);
}

/* Al decir que sí */
si.addEventListener('click', () => {
  $('pregunta').classList.remove('activa');
  $('cartaPantalla').classList.add('activa');
  $('firma').textContent = "— " + CONFIG.yo + " 💗";
  for (let i = 0; i < 30; i++) setTimeout(corazon, i * 60);
  escribir();
  contador();
});
</script>
</body>
</html>
